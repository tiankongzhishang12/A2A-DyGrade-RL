router:
  state_features:
    - item_status
    - difficulty_status
    - agent_capability_status
    - a2a_history
    - remaining_budget
  actions:
    - cheap
    - mid
    - strong
    - evidence
    - second_opinion
    - arbitration
    - stop_item

difficulty_predictor:
  model_kind: hist_gradient_boosting
  diagnostic_model_kind: ridge
  feature_schema_version: difficulty_features_v1
  parameters:
    loss: squared_error
    learning_rate: 0.08
    max_iter: 200
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.1
    early_stopping: true
    random_state: 42
  fixture_model_kind: fixture
  threshold_source_split: train
