pricing_manifest_version: "1.1"
effective_date: "2026-07-31"
currency: USD
pricing_tier: standard
source: "OpenAI official GPT-5.6 model pages reviewed 2026-07-31"
source_urls:
  - https://developers.openai.com/api/docs/models/gpt-5.6-luna
  - https://developers.openai.com/api/docs/models/gpt-5.6-terra
  - https://developers.openai.com/api/docs/models/gpt-5.6-sol

# 官方模型页规定：输入超过272K token时，整次请求input按2倍、output按1.5倍计价。
long_context:
  threshold_input_tokens: 272000
  threshold_operator: ">"
  input_multiplier: 2.0
  output_multiplier: 1.5

models:
  gpt-5.6-luna:
    input_per_million_usd: 0.2
    cached_input_per_million_usd: 0.02
    cache_write_per_million_usd: 0.25
    output_per_million_usd: 1.2
  gpt-5.6-terra:
    input_per_million_usd: 2.0
    cached_input_per_million_usd: 0.2
    cache_write_per_million_usd: 2.5
    output_per_million_usd: 12.0
  gpt-5.6-sol:
    input_per_million_usd: 5.0
    cached_input_per_million_usd: 0.5
    cache_write_per_million_usd: 6.25
    output_per_million_usd: 30.0
