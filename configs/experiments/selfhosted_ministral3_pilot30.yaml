cache_schema_version: "1.2-selfhosted"
local_preparation_only: true
formal_eligible: false
semantic_readiness_manifest_path: data/processed/semantic_v2/semantic_readiness_manifest.json
prepared_root: data/processed/semantic_v2

provider:
  type: openai_chat_completions_compatible
  provider_id: mistral_selfhosted
  gateway_id: vllm_openai_compatible
  base_url: http://127.0.0.1:8000/v1
  api_key_env: SELFHOSTED_API_KEY
  usage_source: server_reported
  require_reported_model_match: true
  require_usage: true
  require_multimodal_token_breakdown: true
  pricing_manifest_path: configs/pricing/ministral3_official_api_equivalent_20260812.yaml
  prepared_root: data/processed/semantic_v2
  timeout_seconds: 180
  max_attempts: 2
  retry_backoff_seconds: 2.0
  max_total_calls: 108
  max_cost_usd: 1.00
  concurrency: 1
  server_hourly_price_usd: null
  actual_server_cost_allocation: per_request_latency

arbitrator_contexts: []

agents:
  cheap:
    agent_id: CheapAgent
    mode: real
    model_id: mistralai/Ministral-3-3B-Instruct-2512-BF16
    model_revision: pending_server_freeze
    prompt_path: prompts/selfhosted_v1/scorer.txt
    prompt_version: selfhosted-v1
    generation_parameters: &common_generation
      temperature: 0.0
      max_tokens: 768
      enable_thinking: false
      response_format: json_schema
  mid:
    agent_id: MidAgent
    mode: real
    model_id: mistralai/Ministral-3-8B-Instruct-2512-BF16
    model_revision: pending_server_freeze
    prompt_path: prompts/selfhosted_v1/scorer.txt
    prompt_version: selfhosted-v1
    generation_parameters: *common_generation
  strong:
    agent_id: StrongAgent
    mode: real
    model_id: mistralai/Ministral-3-14B-Instruct-2512-BF16
    model_revision: pending_server_freeze
    prompt_path: prompts/selfhosted_v1/scorer.txt
    prompt_version: selfhosted-v1
    generation_parameters: *common_generation
  evidence:
    agent_id: EvidenceAgent
    disabled: true
    mode: real
    model_id: disabled-for-checkpoint
    model_revision: disabled
    prompt_path: prompts/selfhosted_v1/scorer.txt
    prompt_version: selfhosted-v1
    generation_parameters: *common_generation
  arbitrator:
    agent_id: ArbitratorAgent
    disabled: true
    mode: real
    model_id: disabled-for-checkpoint
    model_revision: disabled
    prompt_path: prompts/selfhosted_v1/scorer.txt
    prompt_version: selfhosted-v1
    generation_parameters: *common_generation

checkpoint:
  stage: thirty_item
  paper_count: 6
  item_count: 30
  required_agent_ids: [CheapAgent, MidAgent, StrongAgent]
  forbidden_agent_ids: [EvidenceAgent, ArbitratorAgent]
  expected_canonical_calls: 90
  selection_seed: 20260812
  selection_rule_version: selfhosted_ministral3_checkpoint_v1
  require_all_datasets: true
  require_image_item: true
  requires_real_checkpoint_pass: true
